<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <link href="style.css" rel="stylesheet" />
  <title>SMARTSTART — Access</title>
  <style>
    .access-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(1200px 500px at 90% -50%, rgba(233,119,46,.12), transparent 60%),
        radial-gradient(900px 400px at -10% 10%, rgba(15,27,54,.12), transparent 60%);
    }
    .access-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(15,27,54,.10);
      padding: 2.5rem 2.75rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .access-card .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      margin-bottom: 1.5rem;
      text-decoration: none;
      color: var(--ink);
    }
    .access-card .brand img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    .access-card .kicker {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .5rem;
    }
    .access-card h1 {
      font-size: 1.5rem;
      color: var(--ink);
      margin-bottom: .4rem;
    }
    .access-card p {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 1.5rem;
    }
    .access-input {
      width: 100%;
      padding: .7rem 1rem;
      border: 1.5px solid rgba(15,27,54,.15);
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--ink);
      background: var(--bg);
      margin-bottom: .75rem;
      outline: none;
      transition: border-color .2s;
    }
    .access-input:focus {
      border-color: var(--accent);
    }
    .access-btn {
      width: 100%;
      padding: .7rem 1rem;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(233,119,46,.25);
      transition: transform .15s, box-shadow .15s;
    }
    .access-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(233,119,46,.33);
    }
    .access-error {
      color: #c0392b;
      font-size: .88rem;
      margin-top: .6rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div class="access-wrap">
    <div class="access-card">

      <div class="brand">
        <img src="assets/images/smartstart-logo.jpg" alt="SmartStart logo" onerror="this.style.display='none'">
      </div>

      <h1>Enter the access password to continue</h1>

      <input
        class="access-input"
        type="password"
        id="password"
        name="access-password"
        placeholder="Password"
        autocomplete="new-password"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        onkeydown="if(event.key==='Enter') checkPassword()"
      >

      <button class="access-btn" onclick="checkPassword()">Enter</button>

      <p class="access-error" id="error"></p>

    </div>
  </div>

  <script>

    window.addEventListener("pageshow", () => {
    document.getElementById("password").value = "";
      });
    async function checkPassword() {
      const password = document.getElementById("password").value;
      const encoded = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest("SHA-256", encoded);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
      if (hashHex === "038740ef981ab56f4e0529bec9101d1a1d1181886b0c8a917c98029636341360") {
        sessionStorage.setItem("smartstart_access", "granted");
        window.location.href = "home.html";
      } else {
        document.getElementById("error").textContent = "Incorrect password. Please try again.";
      }
    }
  </script>

</body>
</html>
